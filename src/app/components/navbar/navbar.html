<header>


  <div
    class="
      navbar
      bg-base-100
      px-2
      shadow-sm
      md:px-24
      lg:px-24
    "
  >



    <div class="navbar-start">

      <!-- MOBILE MENU -->

      <div class="dropdown">

        <div
          tabindex="0"
          role="button"
          class="
            btn
            btn-lg
            btn-ghost
            transition-colors
            duration-200
            hover:bg-primary/10
            hover:text-primary
            lg:hidden
          "
          aria-label="Abrir menú de navegación"
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-10 w-8"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h8m-8 6h16"
            />
          </svg>

        </div>


        <!-- MOBILE NAVIGATION -->

        <ul
          tabindex="-1"
          class="
            menu
            dropdown-content
            z-50
            mt-3
            w-72
            rounded-box
            border
            border-base-300
            bg-base-100
            p-3
            shadow-xl
          "
        >

          <!-- SOBRE MÍ -->

          <li>

            <a
              class="
                m-1
                rounded-lg
                p-4
                text-lg
                transition-all
                duration-200
                hover:bg-primary/10
                hover:text-primary
              "
              routerLink="/aboutMe"
              routerLinkActive="bg-primary/10 text-primary font-bold"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              Sobre mí
            </a>

          </li>


          <!-- EXPERIENCIA -->

          <li>

            <a
              class="
                m-1
                rounded-lg
                p-4
                text-lg
                transition-all
                duration-200
                hover:bg-primary/10
                hover:text-primary
              "
              routerLink="/experience"
              routerLinkActive="bg-primary/10 text-primary font-bold"
            >
              Experiencia
            </a>

          </li>


          <!-- PROYECTOS -->

          <li>

            <a
              class="
                m-1
                rounded-lg
                p-4
                text-lg
                transition-all
                duration-200
                hover:bg-primary/10
                hover:text-primary
              "
              routerLink="/projects"
              routerLinkActive="bg-primary/10 text-primary font-bold"
            >
              Proyectos
            </a>

          </li>


          <!-- ========================================= -->
          <!-- SUBMENU CV -->
          <!-- ========================================= -->

          <li>

            <details>

              <summary
                class="
                  m-1
                  rounded-lg
                  p-4
                  text-lg
                  transition-all
                  duration-200
                  hover:bg-primary/10
                  hover:text-primary
                "
              >
                Descargar CV
              </summary>


              <ul
                class="
                  mt-1
                  rounded-box
                  border
                  border-base-300
                  bg-base-200/50
                  p-2
                "
              >

                <!-- CV ESPAÑOL -->

                <li>

                  <a
                    href="CV-KarenUrregoFrontend-Español.pdf"
                    download
                    aria-label="Descargar hoja de vida en español formato PDF"
                    class="
                      flex
                      items-center
                      justify-between
                      gap-3
                      rounded-lg
                      p-4
                      text-base
                      transition-all
                      duration-200
                      hover:bg-primary/10
                      hover:text-primary
                    "
                  >

                    <span>
                      CV en Español
                    </span>

                    <span
                      aria-hidden="true"
                      class="
                        text-primary
                        transition-transform
                        duration-200
                        group-hover:translate-y-1
                      "
                    >
                      ↓
                    </span>

                  </a>

                </li>


                <!-- CV INGLÉS -->

                <li>

                  <a
                    href="CV-KarenUrrego-Frontend-English.pdf"
                    download
                    aria-label="Descargar hoja de vida en inglés formato PDF"
                    class="
                      flex
                      items-center
                      justify-between
                      gap-3
                      rounded-lg
                      p-4
                      text-base
                      transition-all
                      duration-200
                      hover:bg-primary/10
                      hover:text-primary
                    "
                  >

                    <span>
                      CV en Inglés
                    </span>

                    <span
                      aria-hidden="true"
                      class="text-primary"
                    >
                      ↓
                    </span>

                  </a>

                </li>

              </ul>

            </details>

          </li>


          <!-- ========================================= -->
          <!-- CONTACTO -->
          <!-- ========================================= -->

          <li class="mt-2">

            <button
              class="
                btn
                btn-soft
                btn-primary
                m-1
                w-[calc(100%-0.5rem)]
                text-lg
                transition-all
                duration-200
                hover:-translate-y-0.5
                hover:shadow-md
              "
              (click)="mostrarModalContacto = true"
            >
              Contáctame
            </button>

          </li>

        </ul>

      </div>


      <!-- LOGO -->

      <span class="hidden">
        Karen U
      </span>

      <img
        src="img/logoKaren.png"
        class="w-20"
        alt="Karen Urrego - Frontend Developer"
      />

    </div>


    <!-- ========================================= -->
    <!-- DESKTOP NAVIGATION -->
    <!-- ========================================= -->

    <div class="navbar-center hidden lg:flex">

      <ul class="menu menu-horizontal items-center gap-1 px-1">

        <!-- SOBRE MÍ -->

        <li>

          <a
            routerLink="/aboutMe"
            routerLinkActive="text-primary font-bold"
            [routerLinkActiveOptions]="{ exact: true }"
            class="
              transition-all
              duration-200
              hover:bg-primary/10
              hover:text-primary
            "
          >
            Sobre mí
          </a>

        </li>


        <!-- EXPERIENCIA -->

        <li>

          <a
            routerLink="/experience"
            routerLinkActive="text-primary font-bold"
            class="
              transition-all
              duration-200
              hover:bg-primary/10
              hover:text-primary
            "
          >
            Experiencia
          </a>

        </li>


        <!-- PROYECTOS -->

        <li>

          <a
            routerLink="/projects"
            routerLinkActive="text-primary font-bold"
            class="
              transition-all
              duration-200
              hover:bg-primary/10
              hover:text-primary
            "
          >
            Proyectos
          </a>

        </li>


        <!-- ========================================= -->
        <!-- SUBMENU CV DESKTOP -->
        <!-- ========================================= -->

        <li>

          <details>

            <summary
              class="
                cursor-pointer
                transition-all
                duration-200
                hover:bg-primary/10
                hover:text-primary
              "
            >
              Descargar CV
            </summary>


            <ul
              class="
                z-50
                mt-2
                w-56
                rounded-box
                border
                border-base-300
                bg-base-100
                p-2
                shadow-xl
              "
            >

              <!-- CV ESPAÑOL -->

              <li>

                <a
                  href="CV-KarenUrregoFrontend-Español.pdf"
                  download
                  aria-label="Descargar hoja de vida en español formato PDF"
                  class="
                    flex
                    items-center
                    justify-between
                    gap-3
                    rounded-lg
                    p-3
                    transition-all
                    duration-200
                    hover:bg-primary/10
                    hover:text-primary
                  "
                >

                  <span>
                    CV en Español
                  </span>

                  <span
                    aria-hidden="true"
                    class="text-primary"
                  >
                    ↓
                  </span>

                </a>

              </li>


              <!-- CV INGLÉS -->

              <li>

                <a
                  href="CV-KarenUrrego-Frontend-English.pdf"
                  download
                  aria-label="Descargar hoja de vida en inglés formato PDF"
                  class="
                    flex
                    items-center
                    justify-between
                    gap-3
                    rounded-lg
                    p-3
                    transition-all
                    duration-200
                    hover:bg-primary/10
                    hover:text-primary
                  "
                >

                  <span>
                    CV en Inglés
                  </span>

                  <span
                    aria-hidden="true"
                    class="text-primary"
                  >
                    ↓
                  </span>

                </a>

              </li>

            </ul>

          </details>

        </li>


        <!-- CONTACTO -->

        <li>

          <button
            class="
              btn
              btn-soft
              btn-secondary
              mx-2
              transition-all
              duration-200
              hover:-translate-y-0.5
              hover:shadow-md
            "
            (click)="mostrarModalContacto = true"
          >
            Contáctame
          </button>

        </li>

      </ul>

    </div>


    <!-- ========================================= -->
    <!-- THEME TOGGLE -->
    <!-- ========================================= -->

    <div class="navbar-end">

      <label
        class="
          flex
          cursor-pointer
          items-center
          gap-2
          text-xs
          text-base-content/70
        "
        for="theme-toggle"
      >

        <!-- SOL -->

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >

          <circle
            cx="12"
            cy="12"
            r="5"
          />

          <path
            d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
          />

        </svg>


        <span class="hidden sm:inline">
          Cambiar tema
        </span>


        <!-- TOGGLE -->

        <input
          id="theme-toggle"
          type="checkbox"
          class="toggle"
          [checked]="isDark"
          (change)="toggleTheme()"
          aria-label="Cambiar entre tema claro y oscuro"
        />


        <!-- LUNA -->

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >

          <path
            d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
          />

        </svg>

      </label>

    </div>

  </div>


  <app-modal-contacto
    [mostrar]="mostrarModalContacto"
    (cerrar)="mostrarModalContacto = false"
  >
  </app-modal-contacto>

</header>



<app-translate></app-translate>
