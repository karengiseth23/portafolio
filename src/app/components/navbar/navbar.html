
 <header>
    <div class="navbar bg-base-100 shadow-sm px-4 py-6 md:px-24 md:py-10 lg:px-24 lg:py-6">
    <div class="navbar-start">
      <div class="dropdown">
        <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" /> </svg>
        </div>
        <ul
          tabindex="-1"
          class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
          <li><a
            routerLink="/home"
            routerLinkActive="text-primary"
            [routerLinkActiveOptions]="{ exact: true }"
            >Sobre mi</a></li>
          <li><a
            routerLink="/experiencie"
            routerLinkActive="text-primary"
            >Experiencia</a></li>
          <li><a
            routerLink="/projects"
            routerLinkActive="text-primary">Proyectos</a></li>
          <li>
            <a
            class="btn btn-soft btn-primary"
            (click)="mostrarModalContacto = true">
            Contáctame
          </a>
          </li>

        </ul>
      </div>
      <div  class="avatar">
        <div class="w-14 rounded-full">
          <img
            alt="Tailwind CSS Navbar component"
            src="img/avatar.jpeg" />
        </div>
      </div>
      <span class="hidden">Karen U</span>
      <img src="img/logoKaren.png" class="w-20">
    </div>
    <div class="navbar-center hidden lg:flex">
      <ul class="menu menu-horizontal px-1">
        <li><a
            routerLink="/home"
            routerLinkActive="text-primary"
            [routerLinkActiveOptions]="{ exact: true }"
            >Sobre mi</a></li>
        <li><a
            routerLink="/experience"
            routerLinkActive="text-primary"
            >Experiencia</a></li>
        <li><a 
            routerLink="/projects"
            routerLinkActive="text-primary"
            >Proyectos</a></li>
            <li>
            <a
            class="btn btn-sm btn-soft btn-secondary"
            (click)="mostrarModalContacto = true">
            Contáctame
          </a>
          </li>
      </ul>
    </div>

  <div class="navbar-end">
    <label class="flex cursor-pointer gap-2">

      <!-- Sol -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">

        <circle cx="12" cy="12" r="5" />

        <path
          d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />

      </svg>

      <!-- Toggle -->
      <input
        type="checkbox"
        class="toggle"
        [checked]="isDark"
        (change)="toggleTheme()"
        aria-label="Cambiar tema" />

      <!-- Luna -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>

      </svg>

    </label>
  </div>
  </div>
  <app-modal-contacto
  [mostrar]="mostrarModalContacto"
  (cerrar)="mostrarModalContacto = false">
</app-modal-contacto>
 </header>
