@if (showButton) {
  <button
    class="fixed bottom-6 right-6 z-[10000] p-3 rounded-full bg-accent text-white shadow-lg hover:bg-accent/80 transition focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent"
    (click)="scrollToTop()"
    aria-label="Volver arriba"
  >
    <!-- Ícono flecha arriba -->
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
         viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5 15l7-7 7 7"/>
    </svg>
  </button>
}
